name: DeadStreets
version: R08
main: dev.deadstreets.paper.DeadStreetsPlugin
api-version: '26.2'
author: Dead Streets Project
description: Persistent walkers, scragglers, migrating hordes, vanilla spawn policy and Metropolis population flags
load: POSTWORLD
softdepend: [Metropolis]
commands:
  deadstreets:
    description: Dead Streets admin testing and diagnostics
    usage: /deadstreets [status|flags|bloodmoon display <bossbar|scoreboard>|bloodmoon status|horde status|horde spawn <population> <temperament>|horde tp [uuid]|testwarning <population> <temperament>]
    permission: deadstreets.admin
permissions:
  deadstreets.admin:
    description: Admin testing and status
    default: op
