name: DeadStreets
version: R13
main: dev.deadstreets.paper.DeadStreetsPlugin
api-version: '26.2'
author: Dead Streets Project
description: Persistent walkers with dependency-free native swimming Crawlers and three-block Hulks
load: POSTWORLD
softdepend: [Metropolis]
commands:
  deadstreets:
    description: Dead Streets admin testing and diagnostics
    aliases: [ds]
    usage: /ds [status|spawn <hulk|crawler|runner|popper>|flags|bloodmoon display <bossbar|scoreboard>|bloodmoon status|horde status|horde spawn <population> <temperament>|horde tp [uuid]|testwarning <population> <temperament>]
    permission: deadstreets.admin
permissions:
  deadstreets.admin:
    description: Admin testing and status
    default: op
