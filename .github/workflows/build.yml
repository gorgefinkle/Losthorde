name: Compile, core tests and dependency-free Paper runtime smoke
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Core test harness
        run: bash test_core.sh
      - name: Build Paper plugin
        run: mvn -B -ntp -DskipTests clean package
      - name: Verify plugin has no renderer or resource-pack plugin dependencies
        run: |
          python3 - <<'PY'
          import re
          from zipfile import ZipFile

          jar_path = "target/DeadStreets_R13.jar"
          with ZipFile(jar_path) as jar:
              descriptor = jar.read("plugin.yml").decode("utf-8")
              assert not re.search(r"(?m)^depend\\s*:", descriptor), "Required plugin dependencies remain"
              assert "FreeMinecraftModels" not in descriptor
              assert "ResourcePackManager" not in descriptor
              assert not any(name.endswith(".bbmodel") for name in jar.namelist()), "Model assets remain embedded"
              assert not any("VisualManager.class" in name for name in jar.namelist()), "Custom renderer class remains"
              assert "dev/deadstreets/paper/ZombieIdentityManager.class" in jar.namelist(), "Zombie identity/health manager missing"
              config = jar.read("config.yml").decode("utf-8")
              assert "chat-health-bars:" in config and "enabled: true" in config, "Chat health bars are not enabled by default"
          print("Dependency check passed: Paper API only; native infected and identity/health systems are packaged; no FMM, RSPM, DisplayMotion, Blockbench assets or renderer class.")
          PY
      - name: Download Paper 26.2
        run: |
          curl -fsSL -H 'User-Agent: Losthorde-R13-Smoke/1.0' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds?channel=STABLE' \
            -o paper-builds.json
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          test -n "$PAPER_URL" && test "$PAPER_URL" != "null"
          curl -fL "$PAPER_URL" -o paper.jar
      - name: Run Paper 26.2 with Dead Streets only
        run: |
          mkdir -p plugins
          cp target/DeadStreets_R13.jar plugins/DeadStreets.jar
          test "$(find plugins -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          java -Ddeadstreets.native-smoke=true -Xms1G -Xmx1G -jar paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for attempt in $(seq 1 180); do
            if grep -Fq 'Native infected smoke test passed' logs/latest.log 2>/dev/null; then READY=1; break; fi
            if grep -Eq 'Error occurred while enabling DeadStreets|NoClassDefFoundError|NoSuchMethodError' logs/latest.log 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat server-console.log
            cat logs/latest.log 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          grep -F 'Dead Streets R13:' logs/latest.log
          grep -F 'Native infected smoke test passed' logs/latest.log
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Package full source
        run: |
          mkdir -p dist
          cp target/DeadStreets_R13.jar dist/
          git archive --format=zip --output=dist/DeadStreets_R13-source.zip HEAD
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R13-test-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
