name: Compile, core tests and Paper runtime smoke
on:
  push:
    paths-ignore:
      - 'release-assets/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Core test harness
        run: bash test_core.sh
      - name: Build Paper plugin
        run: mvn -B -ntp -DskipTests clean package
      - name: Verify optional BetterModel integration and packaged Blockbench assets
        run: |
          python3 - <<'PY'
          import re, json, base64
          from zipfile import ZipFile

          jar_path = "target/DeadStreets_R24.jar"
          with ZipFile(jar_path) as jar:
              names = jar.namelist()
              descriptor = jar.read("plugin.yml").decode("utf-8")
              assert not re.search(r"(?m)^depend\\s*:", descriptor), "BetterModel must remain optional"
              assert "BetterModel" in descriptor, "BetterModel soft dependency missing"
              assert "bettermodel/models/deadstreets_crawler.bbmodel" in names, "Crawler Blockbench model missing"
              assert "bettermodel/models/deadstreets_hulk.bbmodel" in names, "Hulk Blockbench model missing"
              for path, animation in [
                  ("bettermodel/models/deadstreets_crawler.bbmodel", "crawl"),
                  ("bettermodel/models/deadstreets_hulk.bbmodel", "heavy_walk"),
              ]:
                  model = json.loads(jar.read(path))
                  assert model["name"] in ("deadstreets_crawler", "deadstreets_hulk")
                  group_ids = {group["uuid"] for group in model["groups"]}
                  assert None not in group_ids and model["outliner"][0]["uuid"] in group_ids, "Model root bone UUID is invalid"
                  assert any(a["name"] == animation and a["loop"] == "loop" for a in model["animations"])
                  source = model["textures"][0]["source"]
                  assert source.startswith("data:image/png;base64,"), f"Texture placeholder is not a PNG data URI: {path}"
                  png = base64.b64decode(source.split(",", 1)[1])
                  assert len(png) == 96 and png.startswith(bytes.fromhex("89504e470d0a1a0a")), f"Expected transparent 64x64 import placeholder: {path}"
                  elements = {element["name"]: element for element in model["elements"]}
                  expected_uvs = {
                      "head": [8, 8, 16, 16],
                      "torso": [20, 20, 28, 32],
                      "arm_right": [44, 20, 48, 32],
                      "arm_left": [36, 52, 40, 64],
                      "leg_right": [4, 20, 8, 32],
                      "leg_left": [20, 52, 24, 64],
                      "shirt_trim": [20, 36, 28, 39],
                      "shoe_right": [4, 30, 8, 32],
                      "shoe_left": [20, 62, 24, 64],
                  }
                  for element_name, uv in expected_uvs.items():
                      assert elements[element_name]["faces"]["north"]["uv"] == uv, f"{path} {element_name} is not mapped to the vanilla zombie atlas"
              assert "dev/deadstreets/paper/BetterModelBridge.class" in names, "BetterModel bridge missing"
              assert "dev/deadstreets/paper/BetterModelPackHook.class" in names, "BetterModel native pack hook missing"
              assert "dev/deadstreets/paper/ZombieIdentityManager.class" in names, "Targeted identity manager missing"
              config = jar.read("config.yml").decode("utf-8")
              assert "target-display:" in config and "update-interval-ticks: 3" in config, "Aimed identity display is missing"
              assert "chat-health-bars:" not in config, "Obsolete chat health bars remain"
              assert "resource-pack:" in config and "DeadStreets-R24-models.zip" in config, "Integrated BetterModel pack delivery URL is missing"
          horde = open("src/main/java/dev/deadstreets/paper/HordeManager.java", encoding="utf-8").read()
          warning = open("src/main/java/dev/deadstreets/paper/DeadStreetsPlugin.java", encoding="utf-8").read()
          assert "eta,dist" in horde, "Horde alert does not pass live block distance"
          assert "blocks to the " in warning and "Math.round(distanceBlocks)" in warning, "Horde alert must state rounded block distance and compass direction"
          bridge = open("src/main/java/dev/deadstreets/paper/BetterModelBridge.java", encoding="utf-8").read()
          crawler = open("src/main/java/dev/deadstreets/paper/CrawlerManager.java", encoding="utf-8").read()
          assert "hideEntity(" not in bridge, "Do not Bukkit-hide the source mob; this can suppress BetterModel's source spawn lifecycle"
          assert "showToCurrentViewers(tracker, zombie)" in bridge, "BetterModel tracker is not explicitly shown to current viewers"
          assert "candidate.getParameterTypes()[0] == Player.class" in bridge, "BetterModel PlatformPlayer adapter overload must be selected exactly"
          assert "runTask(plugin, () ->" in bridge, "BetterModel tracker must be shown again after Bukkit completes the source spawn tick"
          assert "showToPlayer(entry.getValue(), player)" in bridge, "Late-joining viewers do not receive existing model trackers"
          plugin_source = open("src/main/java/dev/deadstreets/paper/DeadStreetsPlugin.java", encoding="utf-8").read()
          assert "models.forgetPackPlayer(event.getPlayer().getUniqueId())" in plugin_source, "Disconnect must clear integrated resource-pack state for reconnects"
          assert "frontX" in crawler and "actual.getBlockX()" in crawler, "Crawler test spawn must prioritize a visible front position and report exact coordinates"
          assert "Pose.SWIMMING" not in crawler, "Crawler must remain an upright native zombie"
          pack_hook = open("src/main/java/dev/deadstreets/paper/BetterModelPackHook.java", encoding="utf-8").read()
          assert 'String atlasPath = "assets/minecraft/atlases/items.json"' in pack_hook, "BetterModel item textures must register in the items atlas"
          assert "final items atlas" in pack_hook, "Generated-pack audit must verify the items atlas"
          assert 'String oldAtlasPath = "assets/minecraft/atlases/blocks.json"' in pack_hook, "Obsolete blocks-atlas alias cleanup is missing"
          print("Packaging check passed: optional BetterModel integration, source-entity lifecycle, explicit tracker visibility, items-atlas texture fallback, both model assets and targeted identity display are present.")
          PY
      - name: Download Paper 26.2
        run: |
          curl -fsSL -H 'User-Agent: Losthorde-R18-Smoke/1.0' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds?channel=STABLE' \
            -o paper-builds.json
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          test -n "$PAPER_URL" && test "$PAPER_URL" != "null"
          curl -fL "$PAPER_URL" -o paper.jar
      - name: Verify the vanilla 26.2 zombie texture resource exists
        run: |
          curl -fsSL 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json' -o version-manifest.json
          VERSION_URL="$(jq -r '.versions[] | select(.id == "26.2") | .url' version-manifest.json)"
          test -n "$VERSION_URL" && test "$VERSION_URL" != "null"
          curl -fsSL "$VERSION_URL" -o minecraft-version.json
          ASSET_INDEX_URL="$(jq -r '.assetIndex.url' minecraft-version.json)"
          CLIENT_URL="$(jq -r '.downloads.client.url' minecraft-version.json)"
          test -n "$ASSET_INDEX_URL" && test "$ASSET_INDEX_URL" != "null"
          test -n "$CLIENT_URL" && test "$CLIENT_URL" != "null"
          curl -fsSL "$ASSET_INDEX_URL" -o minecraft-assets.json
          curl -fsSL "$CLIENT_URL" -o minecraft-client.jar
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          assets = json.load(open("minecraft-assets.json", encoding="utf-8"))["objects"]
          indexed = sorted(p for p in assets if p.startswith("minecraft/textures/") and ("zombie" in p.lower() or "humanoid" in p.lower()) and p.endswith(".png"))
          with ZipFile("minecraft-client.jar") as jar:
              bundled = sorted(p for p in jar.namelist() if p.startswith("assets/minecraft/textures/") and ("zombie" in p.lower() or "humanoid" in p.lower()) and p.endswith(".png"))
          print("Minecraft 26.2 indexed zombie/humanoid textures:")
          print("\\n".join(indexed) or "(none)")
          print("Minecraft 26.2 bundled zombie/humanoid textures:")
          print("\\n".join(bundled) or "(none)")
          assert indexed or bundled, "Minecraft 26.2 client contains no zombie/humanoid texture assets."
          PY
      - name: Run Paper 26.2 without optional plugins
        run: |
          mkdir -p plugins
          cp target/DeadStreets_R24.jar plugins/DeadStreets.jar
          test "$(find plugins -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          java -Ddeadstreets.native-smoke=true -Xms1G -Xmx1G -jar paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for attempt in $(seq 1 180); do
            if grep -Fq 'Native infected smoke test passed' logs/latest.log 2>/dev/null; then READY=1; break; fi
            if grep -Eq 'Error occurred while enabling DeadStreets|NoClassDefFoundError|NoSuchMethodError' logs/latest.log 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat server-console.log
            cat logs/latest.log 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          grep -F 'Dead Streets R24:' logs/latest.log
          grep -F 'Native infected smoke test passed' logs/latest.log
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          for attempt in $(seq 1 15); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -KILL "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Download BetterModel 3.7.1
        run: |
          curl -fL 'https://github.com/toxicity188/BetterModel/releases/download/3.7.1/bettermodel-3.7.1-paper.jar' -o bettermodel.jar
      - name: Run Paper 26.2 with BetterModel and validate imported assets
        run: |
          mkdir -p bettermodel-smoke/plugins
          cp target/DeadStreets_R24.jar bettermodel-smoke/plugins/DeadStreets.jar
          cp bettermodel.jar bettermodel-smoke/plugins/BetterModel.jar
          mkdir -p bettermodel-smoke/plugins/BetterModel
          unzip -p bettermodel.jar config.yml > bettermodel-smoke/plugins/BetterModel/config.yml
          sed -i 's/exception: false/exception: true/' bettermodel-smoke/plugins/BetterModel/config.yml
          echo 'eula=true' > bettermodel-smoke/eula.txt
          cat > bettermodel-smoke/server.properties <<'EOF'
          online-mode=false
          server-port=25566
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          cd bettermodel-smoke
          java -Ddeadstreets.bettermodel-smoke=true -Xms1G -Xmx1G -jar ../paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for attempt in $(seq 1 300); do
            if grep -Fq 'BetterModel integrated pack smoke test passed' logs/latest.log 2>/dev/null; then READY=1; break; fi
            if grep -Eq 'Error occurred while enabling DeadStreets|NoClassDefFoundError|NoSuchMethodError|BetterModel did not import both' logs/latest.log 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat server-console.log
            cat logs/latest.log 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          grep -F 'BetterModel integrated pack smoke test passed' logs/latest.log
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          pack = Path("plugins/BetterModel/build.zip")
          assert pack.is_file(), f"BetterModel did not generate expected resource pack: {pack}"
          with ZipFile(pack) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              pngs = [n for n in names if n.lower().endswith(".png")]
              assert "pack.mcmeta" in names, "Generated BetterModel pack is missing pack.mcmeta"
              assert len(pngs) >= 2, f"Generated BetterModel pack has only {len(pngs)} PNG assets"
              assert any(n.lower().startswith("assets/") for n in names), "Generated pack has no Minecraft assets tree"
          print(f"Generated BetterModel pack verified: {len(pngs)} PNGs, {pack.stat().st_size} bytes, SHA1={hashlib.sha1(pack.read_bytes()).hexdigest()}")
          PY
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          cd ..
      - name: Upload integrated BetterModel pack for inspection
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R24-integrated-model-pack
          path: bettermodel-smoke/plugins/BetterModel/build.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish integrated BetterModel pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/r10-runner-popper-crawler-hulk'
        run: |
          mkdir -p release-assets
          cp bettermodel-smoke/plugins/BetterModel/build.zip release-assets/DeadStreets-R24-models.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release-assets/DeadStreets-R24-models.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Dead Streets R24 integrated BetterModel pack"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Package full source
        run: |
          mkdir -p dist
          cp target/DeadStreets_R24.jar dist/
          git archive --format=zip --output=dist/DeadStreets_R24-source.zip HEAD
          cd dist
          zip -q DeadStreets-R24-delivery.zip DeadStreets_R24.jar DeadStreets_R24-source.zip
          cd ..
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R24-test-build
          path: dist/DeadStreets-R24-delivery.zip
          if-no-files-found: error
          retention-days: 30
