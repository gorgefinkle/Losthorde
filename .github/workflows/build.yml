name: Compile, core tests and Paper runtime smoke
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Core test harness
        run: bash test_core.sh
      - name: Build Paper plugin
        run: mvn -B -ntp -DskipTests clean package
      - name: Verify optional BetterModel integration and packaged Blockbench assets
        run: |
          python3 - <<'PY'
          import re, json, base64
          from zipfile import ZipFile

          jar_path = "target/DeadStreets_R20.jar"
          with ZipFile(jar_path) as jar:
              names = jar.namelist()
              descriptor = jar.read("plugin.yml").decode("utf-8")
              assert not re.search(r"(?m)^depend\\s*:", descriptor), "BetterModel must remain optional"
              assert "BetterModel" not in descriptor, "Dead Streets must not depend on BetterModel"
              assert "dev/deadstreets/paper/BetterModelBridge.class" in names, "Native model compatibility shim missing"
              assert not any(n.startswith("bettermodel/") for n in names), "Custom model/texture assets must not ship"
              assert "resource-pack:" not in jar.read("config.yml").decode("utf-8"), "Dead Streets must not request a custom texture pack"
              assert "dev/deadstreets/paper/ZombieIdentityManager.class" in names, "Targeted identity manager missing"
              config = jar.read("config.yml").decode("utf-8")
              assert "target-display:" in config and "update-interval-ticks: 3" in config, "Aimed identity display is missing"
              assert "chat-health-bars:" not in config, "Obsolete chat health bars remain"
          horde = open("src/main/java/dev/deadstreets/paper/HordeManager.java", encoding="utf-8").read()
          warning = open("src/main/java/dev/deadstreets/paper/DeadStreetsPlugin.java", encoding="utf-8").read()
          assert "eta,dist" in horde, "Horde alert does not pass live block distance"
          assert "blocks to the " in warning and "Math.round(distanceBlocks)" in warning, "Horde alert must state rounded block distance and compass direction"
          bridge = open("src/main/java/dev/deadstreets/paper/BetterModelBridge.java", encoding="utf-8").read()
          crawler = open("src/main/java/dev/deadstreets/paper/CrawlerManager.java", encoding="utf-8").read()
          assert "hideEntity(" not in bridge, "Do not Bukkit-hide the source mob; this can suppress BetterModel's source spawn lifecycle"
          assert "showToCurrentViewers(tracker, zombie)" in bridge, "BetterModel tracker is not explicitly shown to current viewers"
          assert "candidate.getParameterTypes()[0] == Player.class" in bridge, "BetterModel PlatformPlayer adapter overload must be selected exactly"
          assert "runTask(plugin, () ->" in bridge, "BetterModel tracker must be shown again after Bukkit completes the source spawn tick"
          assert "showToPlayer(entry.getValue(), player)" in bridge, "Late-joining viewers do not receive existing model trackers"
          assert "frontX" in crawler and "actual.getBlockX()" in crawler, "Crawler test spawn must prioritize a visible front position and report exact coordinates"
          print("Packaging check passed: native vanilla infected rendering, no BetterModel dependency, no custom texture/model assets, and targeted identity display.")
          PY
      - name: Download Paper 26.2
        run: |
          curl -fsSL -H 'User-Agent: Losthorde-R20-Smoke/1.0' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds?channel=STABLE' \
            -o paper-builds.json
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          test -n "$PAPER_URL" && test "$PAPER_URL" != "null"
          curl -fL "$PAPER_URL" -o paper.jar
      - name: Run Paper 26.2 without optional plugins
        run: |
          mkdir -p plugins
          cp target/DeadStreets_R20.jar plugins/DeadStreets.jar
          test "$(find plugins -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          java -Ddeadstreets.native-smoke=true -Xms1G -Xmx1G -jar paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for attempt in $(seq 1 180); do
            if grep -Fq 'Native infected smoke test passed' logs/latest.log 2>/dev/null; then READY=1; break; fi
            if grep -Eq 'Error occurred while enabling DeadStreets|NoClassDefFoundError|NoSuchMethodError' logs/latest.log 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat server-console.log
            cat logs/latest.log 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          grep -F 'Dead Streets R20:' logs/latest.log
          grep -F 'Native infected smoke test passed' logs/latest.log
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          for attempt in $(seq 1 15); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -KILL "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Package full source
        run: |
          mkdir -p dist
          cp target/DeadStreets_R20.jar dist/
          git archive --format=zip --output=dist/DeadStreets_R20-source.zip HEAD
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R20-test-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
