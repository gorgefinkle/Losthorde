name: Compile, core tests and Paper/FMM runtime smoke
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Core test harness
        run: bash test_core.sh
      - name: Build Paper plugin
        run: mvn -B -ntp -DskipTests package
      - name: Download Paper 26.2, FreeMinecraftModels and ResourcePackManager
        run: |
          curl -fsSL -H 'User-Agent: Losthorde-R12-Smoke/1.0' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds?channel=STABLE' \
            -o paper-builds.json
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          test -n "$PAPER_URL" && test "$PAPER_URL" != "null"
          curl -fL "$PAPER_URL" -o paper.jar
          FMM_URL="$(curl -fsSL -H 'User-Agent: Losthorde-R12-Smoke/1.0' 'https://api.modrinth.com/v2/project/free-minecraft-models/version' | jq -r '[.[] | select(.version_number == "2.16.0" and (.game_versions | index("26.2")))][0].files[] | select(.primary == true) | .url')"
          RSPM_URL="$(curl -fsSL -H 'User-Agent: Losthorde-R12-Smoke/1.0' 'https://api.modrinth.com/v2/project/resourcepackmanager/version' | jq -r '[.[] | select(.version_number == "2.4.13" and (.game_versions | index("26.2")))][0].files[] | select(.primary == true) | .url')"
          test -n "$FMM_URL" && test "$FMM_URL" != "null"
          test -n "$RSPM_URL" && test "$RSPM_URL" != "null"
          curl -fL "$FMM_URL" -o FreeMinecraftModels.jar
          curl -fL "$RSPM_URL" -o ResourcePackManager.jar
          mkdir -p plugins/ResourcePackManager
          cp target/DeadStreets_R12.jar plugins/DeadStreets.jar
          cp FreeMinecraftModels.jar plugins/FreeMinecraftModels.jar
          cp ResourcePackManager.jar plugins/ResourcePackManager.jar
          # The smoke test validates import and rendering APIs without publishing a test pack.
          cat > plugins/ResourcePackManager/config.yml <<'EOF'
          autoHost: false
          selfHostEnabled: false
          EOF
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          java -Ddeadstreets.model-smoke=true -Xms1G -Xmx1G -jar paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for attempt in $(seq 1 360); do
            if grep -q 'FMM runtime smoke test passed' logs/latest.log 2>/dev/null; then READY=1; break; fi
            if grep -qE 'Could not install Dead Streets|FMM runtime smoke test failed|FreeMinecraftModels reloaded but one or more Dead Streets models are still missing' logs/latest.log 2>/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat server-console.log
            cat logs/latest.log 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          cat server-console.log
          grep -F 'FreeMinecraftModels loaded all four Dead Streets models.' logs/latest.log
          grep -F 'FMM runtime smoke test passed' logs/latest.log
          grep -F 'Dead Streets R12:' logs/latest.log
      - name: Package full source
        run: |
          mkdir -p dist
          cp target/DeadStreets_R12.jar dist/
          git archive --format=zip --output=dist/DeadStreets_R12-source.zip HEAD
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R12-test-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
