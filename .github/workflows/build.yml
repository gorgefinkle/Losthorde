name: Compile and core tests
on:
  push:
  pull_request:
jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Core test harness
        run: bash test_core.sh
      - name: Build Paper plugin
        run: mvn -B -ntp -DskipTests package
      - name: Package full source
        run: |
          mkdir -p dist
          cp target/DeadStreets_R09.jar dist/
          git archive --format=zip --output=dist/DeadStreets_R09-source.zip HEAD
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeadStreets-R09-test-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
