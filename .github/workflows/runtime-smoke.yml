name: Temporary Paper runtime smoke test
on:
  push:
    branches:
      - r10-runner-popper-crawler-hulk
jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build Dead Streets
        run: mvn -B -ntp -DskipTests package
      - name: Download Paper 26.2 stable and DisplayMotion
        run: |
          curl -fsSL -H 'User-Agent: DeadStreets-R11-Smoke/1.0' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds?channel=STABLE' \
            -o paper-builds.json
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          test -n "$PAPER_URL" && test "$PAPER_URL" != "null"
          curl -fL "$PAPER_URL" -o paper.jar
          curl -fL 'https://github.com/Jan1k1/displaymotion/releases/download/v0.4.0/DisplayMotion-0.4.0.jar' -o DisplayMotion.jar
      - name: Prepare headless test server
        run: |
          mkdir -p plugins
          cp target/DeadStreets_R11.jar plugins/DeadStreets.jar
          cp DisplayMotion.jar plugins/DisplayMotion.jar
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
      - name: Start Paper and verify all four models load
        run: |
          set +e
          timeout 240s java -Xms1G -Xmx1G -jar paper.jar --nogui > server-console.log 2>&1
          SERVER_EXIT=$?
          set -e
          cat server-console.log
          test -f logs/latest.log
          grep -F 'Loaded runner_husk:' logs/latest.log
          grep -F 'Loaded popper_drowned:' logs/latest.log
          grep -F 'Loaded crawler_lowprofile:' logs/latest.log
          grep -F 'Loaded hulk_brute:' logs/latest.log
          grep -F 'Dead Streets R11:' logs/latest.log
          if [ "$SERVER_EXIT" -ne 0 ] && [ "$SERVER_EXIT" -ne 124 ]; then
            exit "$SERVER_EXIT"
          fi
